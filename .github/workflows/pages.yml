name: Deploy to GitHub Pages

# Publishes the static export in dist/ to GitHub Pages.
# The Node server cannot run on Pages, so this builds the site ahead of time
# and uploads the plain files. Pushing to main is enough to redeploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue them instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Compiles icons + Tailwind into public/, then pre-renders the pages.
      - run: npm run export:static

      # Guards against publishing a half-built site.
      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/js/main.js
          test -f dist/css/tailwind.css

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4