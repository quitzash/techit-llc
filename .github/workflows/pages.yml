name: Deploy to GitHub Pages

# Optional static mirror. Production deploys happen on Vercel; this workflow
# keeps a static copy of the Astro build available on GitHub Pages too.
# Pushing to main is enough to redeploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue them instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Compiles icons + Tailwind, then builds the static Astro site.
      - run: npm run build

      # Guards against publishing a half-built site.
      - name: Verify output
        run: |
          test -f dist/client/index.html
          test -f dist/client/404.html
          test -f dist/client/js/main.js
          test -f dist/client/css/tailwind.css

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
